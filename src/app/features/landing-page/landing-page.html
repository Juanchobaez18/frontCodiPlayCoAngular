<div class="hero">
	<header id="main-header" class="glass-navbar animate-navbar-slideIn">
		<div class="header-container">
			<a routerLink="/" class="logo-wrapper">
				<img src="img/logo.png" alt="CodiPlayCo Logo" class="logo-animate" />
			</a>

			<nav id="main-nav" class="nav-wrapper">
				<a class="nav-link-glass" routerLink="/cursos">Cursos</a>
				<a class="nav-link-glass" routerLink="/quienes-somos">Quienes Somos</a>
				<a class="nav-link-glass" routerLink="/preguntas-frecuentes">Preguntas Frecuentes</a>
			</nav>

			<div class="actions-wrapper">
				<div id="nav-toggle" class="hamburger">
					<span></span>
					<span></span>
					<span></span>
				</div>
				<a class="btn-launch" href="/auth">
					<span>Iniciar Sesión</span>
				</a>
			</div>
		</div>
	</header>

	<div id="mobile-menu" class="mobile-menu">
		<a class="nav-link-glass" routerLink="/cursos">Cursos</a>
		<a class="nav-link-glass" routerLink="/quienes-somos">Quienes Somos</a>
		<a class="nav-link-glass" routerLink="/preguntas-frecuentes">Preguntas Frecuentes</a>
	</div>

	<main class="container">
		<div class="hero-content">
			<div class="hero-text">
				<h1 class="animate-codiplay-title">
					Empieza tu<br /> aventura<br /> con CodiPlay
				</h1>
				<p class="hero-subtitle">
					¡Diviértete programando desde cero!
				</p>
				<a class="btn-trade" routerLink="/auth/register">
					<span>Regístrate aquí</span>
				</a>
			</div>
			<div class="hero-robot">
				<img src="img/robot.png" alt="Robot CodiPlay" class="astronaut-float-3d-big" />
			</div>
		</div>
	</main>
</div>

<footer>
	<p>&copy; 2025 CodiPlayCo — Hecho para pequeños programadores</p>
</footer>

<script>
	document.addEventListener('DOMContentLoaded', function () {
		const navToggle = document.getElementById('nav-toggle');
		const mobileMenu = document.getElementById('mobile-menu');

		if (navToggle && mobileMenu) {
			navToggle.addEventListener('click', () => {
				navToggle.classList.toggle('active');
				mobileMenu.classList.toggle('active');
				document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : 'auto';
			});

			mobileMenu.addEventListener('click', (e) => {
				if (e.target.closest('.nav-link-glass')) {
					navToggle.classList.remove('active');
					mobileMenu.classList.remove('active');
					document.body.style.overflow = 'auto';
				}
			});
		}
	});
</script>
