<div class="lista-lecciones-estudiante">
  <div class="header">
    <h1>Lecciones Disponibles</h1>
  </div>

  <div class="loading" *ngIf="cargando">
    <p>Cargando lecciones...</p>
  </div>

  <div class="error" *ngIf="error">
    <p>{{ error }}</p>
    <button class="btn btn-secondary" (click)="cargarLecciones()">Reintentar</button>
  </div>

  <div class="cards-container" *ngIf="!cargando && !error">
    <div class="card" *ngFor="let leccion of lecciones" (click)="verDetalle(leccion.id)">
      <div class="card-header">
        <span class="orden">{{ leccion.orden }}</span>
      </div>
      <h3>{{ leccion.titulo }}</h3>
      <p>{{ leccion.descripcion }}</p>
      <div class="card-footer">
        <span class="fecha">{{ leccion.creadoEn | date:'mediumDate' }}</span>
        <button class="btn btn-primary">Ver Lección</button>
      </div>
    </div>

    <div class="sin-datos" *ngIf="lecciones.length === 0">
      <p>No hay lecciones disponibles en este momento.</p>
    </div>
  </div>
</div>
