<div class="dialogo-overlay" *ngIf="visible" (click)="onCancelar()">
  <div class="dialogo-contenido" (click)="$event.stopPropagation()">
    <div class="dialogo-header">
      <h2>Confirmar Eliminación</h2>
    </div>
    
    <div class="dialogo-body">
      <p>¿Estás seguro de que deseas eliminar la lección <strong>{{ leccion?.titulo }}</strong>?</p>
      <p class="advertencia">Esta acción no se puede deshacer.</p>
    </div>
    
    <div class="dialogo-footer">
      <button class="btn btn-secondary" (click)="onCancelar()">Cancelar</button>
      <button class="btn btn-danger" (click)="onConfirmar()">Eliminar</button>
    </div>
  </div>
</div>
